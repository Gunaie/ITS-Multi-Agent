services:
  # ==================== 基础设施 ====================
  # MySQL 数据库
  mysql:
    image: mysql:8.0
    container_name: its-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_PASSWORD:-its_secure_2024}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-its}
      TZ: Asia/Shanghai
    ports:
      - "33070:3306"  # 宿主 3307–3406 被 Windows Hyper-V 保留段占用，改用 33070
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - its-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-p${MYSQL_PASSWORD:-its_secure_2024}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # Redis 缓存 (会话存储)
  redis:
    image: redis:7-alpine
    container_name: its-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - its-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ==================== 应用服务 ====================
  # 知识库服务 (Knowledge API — RAG 检索 + 文档管理)
  knowledge-api:
    build:
      context: ./backend
      dockerfile: knowledge/Dockerfile
    container_name: its-knowledge-api
    restart: unless-stopped
    ports:
      - "8001:8001"
    volumes:
      - ./backend/knowledge/chroma_kb1:/app/chroma_kb1
      - ./backend/knowledge/data:/app/data
    env_file:
      - .env
    environment:
      - OPENAI_API_KEY=${AL_BAILIAN_API_KEY}
      - OPENAI_BASE_URL=${AL_BAILIAN_BASE_URL}
    networks:
      - its-network
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8001/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  # 主智能体后端 (Agent 编排 + 工具集成)
  main-backend:
    build:
      context: ./backend
      dockerfile: app/Dockerfile
    container_name: its-main-backend
    restart: unless-stopped
    ports:
      - "8002:8002"
    env_file:
      - .env
    environment:
      # 通过 docker 网络名访问（不再依赖 host.docker.internal）
      - MYSQL_HOST=mysql
      - MYSQL_PORT=3306
      - MYSQL_USER=${MYSQL_USER:-root}
      - MYSQL_PASSWORD=${MYSQL_PASSWORD:-its_secure_2024}
      - MYSQL_DATABASE=${MYSQL_DATABASE:-its}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - KNOWLEDGE_BASE_URL=http://knowledge-api:8001
      - BAIDU_MAP_AK=${BAIDU_MAP_AK}
      - AL_BAILIAN_API_KEY=${AL_BAILIAN_API_KEY}
      - AL_BAILIAN_BASE_URL=${AL_BAILIAN_BASE_URL}
      - ORCHESTRATOR_MODEL_NAME=${ORCHESTRATOR_MODEL_NAME}
      - TECHNICAL_MODEL_NAME=${TECHNICAL_MODEL_NAME}
      - SERVICE_MODEL_NAME=${SERVICE_MODEL_NAME}
      - LANGCHAIN_TRACING_V2=${LANGCHAIN_TRACING_V2:-false}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY:-}
      - LANGCHAIN_PROJECT=${LANGCHAIN_PROJECT:-its-multi-agent}
    networks:
      - its-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      knowledge-api:
        condition: service_started

  # 前端咨询平台
  frontend:
    build: ./front/agent_web_ui
    container_name: its-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./docker/nginx-frontend.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - its-network
    depends_on:
      - main-backend

  # 前端管理平台
  frontend-admin:
    build: ./front/knowlege_platform_ui
    container_name: its-frontend-admin
    restart: unless-stopped
    ports:
      - "81:80"
    volumes:
      - ./docker/nginx-frontend.conf:/etc/nginx/conf.d/default.conf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - its-network
    depends_on:
      - main-backend

volumes:
  mysql_data:
  redis_data:

networks:
  its-network:
    driver: bridge
