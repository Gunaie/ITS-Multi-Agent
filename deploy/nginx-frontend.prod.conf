# 生产环境前端 nginx 配置（its-frontend / its-frontend-admin 共用）。
# 与本地版的差异: 代理目标改为 compose 网络内的容器名（同 its-network），
# 不再依赖 host.docker.internal，后端因此无需映射任何宿主端口。
server {
    listen 80;
    server_name _;

    # 内容哈希命名的静态资源(assets/index-xxxx.js): 可永久强缓存
    location /assets/ {
        root /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html index.htm;
        try_files $uri $uri/ /index.html;
        # SPA 入口禁止缓存: 保证发布后浏览器立刻拿到新 index.html(引用新哈希资源)
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
    }

    # 知识库后端 (容器名直连)
    location /api/ {
        proxy_pass http://knowledge-api:8001/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 50m;
        # RAG 生成(思考模型)+大文件上传可能超过默认 60s
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # 主智能体后端 (容器名直连)
    location /app/ {
        proxy_pass http://main-backend:8002/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE 支持
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_cache off;
        proxy_buffering off;
        chunked_transfer_encoding on;
        tcp_nopush on;
        tcp_nodelay on;
        keepalive_timeout 65;
        # /chat 与 /chat_knowledge 含 RAG 生成(思考模型), 实测可超 60s, 默认超时会 504
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }
}
