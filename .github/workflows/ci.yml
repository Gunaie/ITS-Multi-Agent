name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    env:
      # 纯逻辑单测不发起真实 API 调用；这两个变量仅为通过 settings 的启动必填校验
      AL_BAILIAN_API_KEY: ci-dummy-key
      AL_BAILIAN_BASE_URL: https://ci.invalid/v1

    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/app/requirements.txt
            backend/knowledge/requirements.txt

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/app/requirements.txt
          pip install pytest

      - name: 运行单元测试
        run: pytest backend/tests -v
